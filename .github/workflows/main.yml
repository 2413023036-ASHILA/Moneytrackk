name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependensi & Build Web
        run: |
          npm install
          npm run build

      - name: Pasang Capacitor & Buat Proyek Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Moneytrackk" "com.ashila.moneytrackk" --web-dir=dist || true
          npx cap add android
          npx cap sync android

      - name: Kompilasi menjadi file APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan hasil APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Moneytrackk-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
